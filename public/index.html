<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zarcovi RPG Banco</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
</head>
<body>
  <main class="shell">
    <section class="hero card">
      <div>
        <p class="eyebrow">Zarcovi RPG</p>
        <h1>Banco de contas</h1>
        <p class="muted">Login, consulta de conta, ryos, level, vila, personagem e ranking sincronizado pela planilha oficial.</p>
      </div>
      <a href="/admin.html" class="ghost-link">Painel staff</a>
    </section>

    <section class="grid two">
      <div class="card">
        <h2>Entrar</h2>
        <form id="loginForm" class="form">
          <label>Email<input name="email" type="email" required placeholder="voce@email.com" /></label>
          <label>Senha<input name="password" type="password" required placeholder="Senha do app" /></label>
          <button>Entrar</button>
        </form>
      </div>

      <div class="card">
        <h2>Criar acesso</h2>
        <form id="registerForm" class="form">
          <label>Nick<input name="nick" required placeholder="Seu nick" /></label>
          <label>Conta Zarcovi<input name="account_code" required placeholder="MY9314" maxlength="6" /></label>
          <label>Email<input name="email" type="email" required placeholder="voce@email.com" /></label>
          <label>Senha do app<input name="password" type="password" required minlength="6" placeholder="mínimo 6 caracteres" /></label>
          <button>Cadastrar</button>
        </form>
      </div>
    </section>

    <section id="dashboard" class="card hidden">
      <div class="section-head">
        <div>
          <p class="eyebrow">Minha conta</p>
          <h2 id="profileTitle">Carregando...</h2>
        </div>
        <button id="logoutBtn" class="secondary">Sair</button>
      </div>
      <div id="profileGrid" class="stats"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <p class="eyebrow">Ranking</p>
          <h2>Top contas</h2>
        </div>
        <button id="refreshRanking" class="secondary">Atualizar</button>
      </div>
      <div class="table-wrap"><table id="rankingTable"></table></div>
    </section>

    <p id="status" class="status"></p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
