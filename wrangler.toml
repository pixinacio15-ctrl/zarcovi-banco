6) ERROS COMUNS

Se aparecer Hello World:
- o Cloudflare está publicando outro index.html.
- deixe Build output directory como public.
- confirme que public/index.html é o arquivo certo.

Se aparecer Roboflow:
- o Cloudflare está rodando deploy errado.
- Deploy command precisa ficar vazio.
- Build command precisa ser npm run build.

Se SQL der erro account_code:
- rode o schema.sql inteiro.
- ele apaga as tabelas antigas deste projeto e recria limpo.

Se sync falhar:
- confira SYNC_SOURCE_URL.
- publique a planilha como CSV ou use o Apps Script em google-apps-script/exportar-csv.gs.
